<div class="handler-details">
    <span class="badge badge-success mr-2">Resize</span>
    <dl class="row mb-0 mt-2">
        <sly data-sly-test="${properties.width}">
            <dt class="col-sm-4">${'Width' @ i18n}</dt>
            <dd class="col-sm-8"><strong>${properties.width}px</strong></dd>
        </sly>
        <sly data-sly-test="${properties.height}">
            <dt class="col-sm-4">${'Height' @ i18n}</dt>
            <dd class="col-sm-8"><strong>${properties.height}px</strong></dd>
        </sly>
        <dt class="col-sm-4">${'Keep Aspect Ratio' @ i18n}</dt>
        <dd class="col-sm-8">
            <sly data-sly-test="${properties.keepAspectRatio}">
                <span class="badge badge-info">${'Yes' @ i18n}</span>
            </sly>
            <sly data-sly-test="${!properties.keepAspectRatio}">
                <span class="badge badge-secondary">${'No' @ i18n}</span>
            </sly>
        </dd>
    </dl>
</div>
