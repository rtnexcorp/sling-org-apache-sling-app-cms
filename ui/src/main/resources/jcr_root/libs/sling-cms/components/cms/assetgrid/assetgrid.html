<sly data-sly-use.model="org.apache.sling.cms.core.models.AssetGridModel">
    <div class="asset-grid-wrapper">

        <!--/* Asset Filter */-->
        <sly data-sly-resource="${'.' @ resourceType='sling-cms/components/cms/assetfilter'}"></sly>

        <!--/* Asset Grid Container */-->
        <div class="asset-grid reload-container scroll-container contentnav" data-view="grid" data-filterable-container>
            <div class="asset-grid__items cms-grid cms-grid--multiline">
                <sly data-sly-list.item="${model.items}">
                    <div class="cms-grid__item cms-grid__item--half-tablet cms-grid__item--third-widescreen cms-grid__item--quarter-fullhd contentnav__item asset-item"
                         data-filterable-item
                         data-asset-item
                         data-name="${item.nameLowercase}"
                         data-mime-type="${item.mimeType}"
                         data-asset-type="${item.mimeType @ context='attribute'}"
                         data-asset-size="${item.assetSize @ context='attribute'}"
                         data-modified-date="${item.modifiedDate @ context='attribute'}"
                         data-is-folder="${item.folder}"
                         data-taxonomy="${item.taxonomyStr}">
                        <div class="card is-linked asset-card" title="${item.title}" data-value="${item.path}">
                            <div class="card-image">
                                <figure class="image is-5by4">
                                    <img src="${item.thumbnailPath}" loading="lazy" alt="${item.name}">
                                    <sly data-sly-test="${item.video}">
                                        <span class="asset-badge asset-badge--video">
                                            <i class="jam jam-video-camera"></i>
                                        </span>
                                    </sly>
                                    <sly data-sly-test="${item.pdf}">
                                        <span class="asset-badge asset-badge--pdf">PDF</span>
                                    </sly>
                                </figure>
                                <div class="is-vhidden cell-actions">
                                    <sly data-sly-list.action="${item.actions}">
                                        <sly data-sly-test="${action.resourceType == 'sling-cms/components/cms/actions/modal'}">
                                            <a class="button Fetch-Modal"
                                               data-title="${action.title}"
                                               data-path="${action.ajaxPath || '.Main-Content form'}"
                                               href="${action.prefix}${action.itemPath}${action.suffix}"
                                               title="${action.title}">
                                                <span class="jam jam-${action.icon}">
                                                    <span class="is-sr-only">${action.title}</span>
                                                </span>
                                            </a>
                                        </sly>
                                        <sly data-sly-test="${action.resourceType == 'sling-cms/components/cms/actions/basic'}">
                                            <a class="button"
                                               target="${action.openInNew ? '_blank' : '_self'}"
                                               href="${action.prefix}${action.itemPath}${action.suffix}"
                                               title="${action.title}">
                                                <span class="jam jam-${action.icon}">
                                                    <span class="is-sr-only">${action.title}</span>
                                                </span>
                                            </a>
                                        </sly>
                                    </sly>
                                </div>
                            </div>
                            <div class="card-content asset-card__info">
                                <p class="asset-card__title" title="${item.title}">
                                    ${item.title}
                                </p>
                                <sly data-sly-test="${item.file}">
                                    <div class="asset-card__meta">
                                        <sly data-sly-test="${item.fileExtension}">
                                            <span class="tag is-light is-small">${item.fileExtension}</span>
                                        </sly>
                                        <sly data-sly-test="${item.fileSize}">
                                            <span class="asset-card__size">${item.fileSize}</span>
                                        </sly>
                                    </div>
                                </sly>
                                <sly data-sly-test="${item.lastModified}">
                                    <small class="asset-card__date">${item.lastModified}</small>
                                </sly>
                            </div>
                            <footer class="card-footer">
                                <span class="card-footer-item publication-status publication-status__${item.published ? 'published' : 'unpublished'}">
                                    <sly data-sly-test="${item.published}">${'Published' @ i18n}</sly>
                                    <sly data-sly-test="${!item.published}">${'Draft' @ i18n}</sly>
                                </span>
                            </footer>
                        </div>
                    </div>
                </sly>
            </div>

            <!-- Empty state -->
            <div class="asset-grid__empty" style="display: none;">
                <div class="has-text-centered py-6">
                    <span class="icon is-large">
                        <i class="jam jam-folder-open" style="font-size: 3rem;"></i>
                    </span>
                    <p class="mt-4">${'No assets found' @ i18n}</p>
                </div>
            </div>

            <!-- Pagination -->
            <sly data-sly-test="${model.totalItems > model.pageSize}">
                <nav class="pagination is-centered mt-4" role="navigation" aria-label="pagination">
                    <sly data-sly-test="${model.hasPreviousPage}">
                        <a class="pagination-previous" href="?page=${model.previousPage}">
                            ${'Previous' @ i18n}
                        </a>
                    </sly>
                    <sly data-sly-test="${model.hasNextPage}">
                        <a class="pagination-next" href="?page=${model.nextPage}">
                            ${'Next' @ i18n}
                        </a>
                    </sly>
                </nav>
            </sly>
        </div>

        <!-- Hidden count for JS -->
        <script type="application/json" data-asset-metadata>
            {"count": ${model.itemCount}}
        </script>
    </div>
</sly>
