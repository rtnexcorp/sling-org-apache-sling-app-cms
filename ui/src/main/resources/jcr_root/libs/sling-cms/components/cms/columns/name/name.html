<sly data-sly-use.model="org.apache.sling.cms.core.models.NameColumnModel">
<td data-value="${model.path @ context='attribute'}">
    <sly data-sly-test="${model.link}">
        <a class="item-link" href="${model.prefix @ context='attribute'}${model.path @ context='attribute'}">
            ${model.name @ context='html'}
        </a>
    </sly>
    <sly data-sly-test="${!model.link}">
        ${model.name @ context='html'}
    </sly>
</td>
</sly>
