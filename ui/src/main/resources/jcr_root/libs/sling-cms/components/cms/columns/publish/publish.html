<sly data-sly-use.model="org.apache.sling.cms.core.models.PublishColumnModel">
    <td data-value="${model.dataValue}">
        <sly data-sly-test="${model.published}">
            <a class="button is-success is-outlined Fetch-Modal" 
               href="${model.unpublishUrl @ context='attribute'}" 
               title="${'Content Published' @ i18n}" 
               data-title="Unpublish" 
               data-path=".Main-Content form">
                <i class="jam jam-check">
                    <span class="is-sr-only">${'Content Published' @ i18n}</span>
                </i>
            </a>
        </sly>
        <sly data-sly-test="${!model.published}">
            <a class="button is-warning is-outlined Fetch-Modal" 
               href="${model.publishUrl @ context='attribute'}" 
               title="${'Content Not Published' @ i18n}" 
               data-title="Publish" 
               data-path=".Main-Content form">
                <i class="jam jam-close">
                    <span class="is-sr-only">${'Content Not Published' @ i18n}</span>
                </i>
            </a>
        </sly>
    </td>
</sly>
