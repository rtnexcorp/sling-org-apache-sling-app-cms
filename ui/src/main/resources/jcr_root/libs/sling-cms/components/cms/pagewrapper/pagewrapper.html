<sly data-sly-use.model="org.apache.sling.cms.core.models.PageWrapperModel">
    <sly data-sly-test="${model.hasForceResourceType}">
        <sly data-sly-resource="${model.suffixResource @ resourceType=model.forceResourceType}"></sly>
    </sly>
    <sly data-sly-test="${!model.hasForceResourceType}">
        <sly data-sly-resource="${model.suffixResource}"></sly>
    </sly>
    ${model.disableEditMode}
</sly>
