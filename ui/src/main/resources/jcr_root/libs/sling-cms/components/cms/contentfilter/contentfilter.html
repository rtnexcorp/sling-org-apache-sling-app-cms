<sly data-sly-use.model="org.apache.sling.cms.core.models.ContentFilter"/>

<div data-component="content-filter">
    <div class="content-filter__controls">
        <sly data-sly-list.filter="${model.filterConfigs}">
            <div>
                <div class="cms-select">
                    <select id="${filter.id}"
                            data-filter="${filter.dataAttribute}"
                            class="cms-select__input"
                            data-dynamic-options="${filter.dynamicOptions}"
                            aria-label="${filter.label @ i18n}">
                        <sly data-sly-list.option="${filter.options}">
                            <option value="${option.value}">${option.label @ i18n}</option>
                        </sly>
                    </select>
                </div>
            </div>
        </sly>
    </div>
</div>
