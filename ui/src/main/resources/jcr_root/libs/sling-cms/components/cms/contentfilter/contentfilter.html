<sly data-sly-use.taxonomy="org.apache.sling.cms.core.models.TaxonomyModel"/>

<div  data-component="content-filter">
    <div class="content-filter__controls">
        <!--/* Content Type Filter */-->
        <div>
            <div class="cms-select">
                <select id="content-type-filter"
                        data-content-type-filter
                        class="cms-select__input"
                        aria-label="${'Filter by Type' @ i18n}">
                    <option value="">${'All Types' @ i18n}</option>
                    <option value="image/">${'Images' @ i18n}</option>
                    <option value="video/">${'Videos' @ i18n}</option>
                    <option value="application/pdf,application/msword,application/vnd">${'Documents' @ i18n}</option>
                    <option value="folder">${'Folders' @ i18n}</option>
                </select>
            </div>
        </div>

        <!--/* Taxonomy Filter */-->
        <sly data-sly-test="${taxonomy.hasTaxonomyOptions}">
            <div>
                <div class="cms-select">
                    <select id="content-tag-filter"
                            data-content-tag-filter
                            class="cms-select__input"
                            aria-label="${'Filter by Tag' @ i18n}">
                        <option value="">${'All Tags' @ i18n}</option>
                        <sly data-sly-list.option="${taxonomy.taxonomyOptions}">
                            <option value="${option.path}">${option.title}</option>
                        </sly>
                    </select>
                </div>
            </div>
        </sly>
    </div>
</div>
