<!-- HTL: Sling Form Component - renders form with configurable action, encoding, and fields -->

<sly data-sly-use.model="org.apache.sling.cms.core.models.SlingFormModel" />

<form method="post"
    action="${model.formAction @ context='uri'}${model.actionSuffix @ context='uri'}"
    enctype="${model.encoding @ context='attribute'}"
    class="Form-Ajax"
    data-add-date="${model.addDate}"
    data-callback="${model.callback @ context='attribute'}">
    <div class="form-wrapper pt-4 field">
        <input type="hidden" name="_charset_" value="utf-8" />
        <sly data-sly-resource="${'fields' @ resourceType='sling-cms/components/general/container'}" />
        <div class="field">
            <button type="submit" class="button is-primary">
                ${model.buttonLabel @ i18n}
            </button>
            <a href="${model.referer @ context='uri'}"
               class="button close"
               data-sly-test="${!model.skipCancel}">
                ${'Cancel' @ i18n}
            </a>
        </div>
    </div>
</form>
