<sly data-sly-use.model="org.apache.sling.thumbnails.cache.CacheStatisticsModel"></sly>

<div class="cache-statistics" data-sly-test="${model.available}">
    <h4>Cache Statistics</h4>
    <div class="columns">
        <div class="column">
            <div class="box">
                <p class="heading">Total Requests</p>
                <p class="title">${model.totalRequests}</p>
            </div>
        </div>
        <div class="column">
            <div class="box">
                <p class="heading">Cache Hits</p>
                <p class="title has-text-success">${model.hits}</p>
            </div>
        </div>
        <div class="column">
            <div class="box">
                <p class="heading">Cache Misses</p>
                <p class="title has-text-warning">${model.misses}</p>
            </div>
        </div>
        <div class="column">
            <div class="box">
                <p class="heading">Hit Ratio</p>
                <p class="title has-text-info">${model.hitRatioPercent}</p>
            </div>
        </div>
    </div>
    <div class="columns">
        <div class="column">
            <div class="box">
                <p class="heading">Cached Entries</p>
                <p class="title">${model.entries}</p>
            </div>
        </div>
        <div class="column">
            <div class="box">
                <p class="heading">Cache Size</p>
                <p class="title">${model.sizeMB} MB</p>
            </div>
        </div>
    </div>
</div>

<div class="notification is-warning" data-sly-test="${!model.available}">
    <p>Smart Rendition Service is not available. Please check the OSGi console.</p>
</div>
