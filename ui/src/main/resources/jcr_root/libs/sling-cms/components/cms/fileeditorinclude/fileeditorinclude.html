<sly data-sly-use.model="org.apache.sling.cms.core.models.FileEditorIncludeModel">
    <form method="post" action="${model.suffix @ context='attribute'}" enctype="multipart/form-data" class="Form-Ajax">
        <fieldset class="form-wrapper field">
            <sly data-sly-test="${model.hasMatchingEditor}">
                <sly data-sly-resource="${model.matchingEditorFieldsPath @ resourceType='sling-cms/components/general/container'}"></sly>
            </sly>
            <sly data-sly-test="${model.hasGeneralEditor}">
                <sly data-sly-resource="${model.generalEditorFieldsPath @ resourceType='sling-cms/components/general/container'}"></sly>
            </sly>
            <sly data-sly-test="${model.hasNoEditor}">
                ${'No editor configured for {0}!' @ i18n, format=model.mimeType, context='html'}
            </sly>
            <div class="Field-Group">
                <button type="submit" class="button is-primary">
                    ${'Save File' @ i18n}
                </button>
                <button type="button" class="button close">${'Cancel' @ i18n}</button>
            </div>
        </fieldset>
    </form>
</sly>
