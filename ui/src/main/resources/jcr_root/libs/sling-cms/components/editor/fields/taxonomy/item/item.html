<sly data-sly-use.parentProps="${'org.apache.sling.api.resource.Resource' @ path=resource.parent.parent.path}">
    <a class="tag labelfield__item" title="${resource.path}" data-sly-test="${resource}">
        <input type="hidden" name="${parentProps.valueMap.name @ context='attribute'}" value="${resource.path @ context='attribute'}" />
        <span class="labelfield__title">
            ${resource.valueMap['jcr:title'] @ context='html'}
        </span>
        <button class="delete is-small">
            <span class="is-sr-only">
                ${'Delete' @ i18n}
            </span>
        </button>
    </a>
</sly>
