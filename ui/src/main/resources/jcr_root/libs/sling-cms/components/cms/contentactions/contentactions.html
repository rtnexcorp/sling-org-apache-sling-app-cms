<sly data-sly-use.model="org.apache.sling.cms.core.models.ContentActionsModel">
<nav class="level">
    <div class="level-left">
        <div class="level-item">
            <div class="buttons has-addons">
                <sly data-sly-list.action="${model.actions}">
                    <a class="button Fetch-Modal" 
                       data-title="Add ${action.label @ context='attribute'}" 
                       data-path=".Main-Content form" 
                       href="${action.prefix @ context='attribute'}${model.requestSuffix @ context='attribute'}${action.suffix @ context='attribute'}">
                        + ${action.label @ i18n, context='html'}
                    </a>
                </sly>
            </div>
        </div>
        <div class="level-item">
            <div class="buttons has-addons actions-target">
            </div>
        </div>
    </div>
    <sly data-sly-test="${properties.includeSwitcher}">
        <div class="level-right">
            <div class="level-item">
                <div class="field">
                    <div class="control has-icons-left">
                        <form method="get" action="" class="layout-switch is-inline">
                            <div class="select">
                                <select aria-label="Select View">
                                    <sly data-sly-test="${model.isTableView}">
                                        <option value="${model.gridViewUrl @ context='attribute'}">${'Grid' @ i18n}</option>
                                        <option selected value="${model.tableViewUrl @ context='attribute'}">${'Table' @ i18n}</option>
                                    </sly>
                                    <sly data-sly-test="${!model.isTableView}">
                                        <option selected value="${model.gridViewUrl @ context='attribute'}">${'Grid' @ i18n}</option>
                                        <option value="${model.tableViewUrl @ context='attribute'}">${'Table' @ i18n}</option>
                                    </sly>
                                </select>
                            </div>
                            <span class="icon is-small is-left">
                                <i class="jam jam-layout"></i>
                            </span>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </sly>
</nav>
</sly>
