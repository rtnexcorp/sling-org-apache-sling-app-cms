<sly data-sly-use.meta="org.apache.sling.thumbnails.AssetMetadata"/>

<div class="asset-metadata-editor">
    <div class="cms-grid cms-grid--gapped">
        <!--/* Preview Column */-->
        <div class="cms-grid__item cms-grid__item--third">
            <div class="asset-metadata-editor__preview">
                <figure class="image mb-3">
                    <sly data-sly-test="${meta.image}">
                        <img src="${meta.thumbnailUrl}" alt="${meta.fileName}"/>
                    </sly>
                    <sly data-sly-test="${meta.video}">
                        <img src="${meta.thumbnailUrl}" alt="${meta.fileName}"/>
                        <span class="asset-badge asset-badge--video asset-badge--large">
                            <i class="jam jam-video-camera"></i> ${'Video' @ i18n}
                        </span>
                    </sly>
                    <sly data-sly-test="${meta.pdf}">
                        <img src="${meta.thumbnailUrl}" alt="${meta.fileName}"/>
                    </sly>
                    <sly data-sly-test="${!meta.image && !meta.video && !meta.pdf}">
                        <img src="/static/sling-cms/thumbnails/file.png" alt="${meta.fileName}"/>
                    </sly>
                </figure>

                <table class="table is-narrow is-fullwidth is-size-7">
                    <tbody>
                        <tr><th>${'File' @ i18n}</th><td>${meta.fileName}</td></tr>
                        <tr><th>${'Type' @ i18n}</th><td>${meta.mimeType}</td></tr>
                        <tr><th>${'Size' @ i18n}</th><td>${meta.formattedFileSize}</td></tr>
                        <sly data-sly-test="${meta.hasDimensions}">
                            <tr><th>${'Dimensions' @ i18n}</th><td>${meta.imageWidth} x ${meta.imageHeight} px</td></tr>
                        </sly>
                    </tbody>
                </table>

                <sly data-sly-test="${meta.hasRenditions}">
                    <p class="is-size-7 has-text-weight-bold mb-1">${'Renditions' @ i18n}</p>
                    <div class="tags are-small">
                        <sly data-sly-list.rendition="${meta.renditions}">
                            <a href="${rendition.path}" class="tag is-link" target="_blank">${rendition.name}</a>
                        </sly>
                    </div>
                </sly>
            </div>
        </div>

        <!--/* Form Column */-->
        <div class="cms-grid__item cms-grid__item--two-thirds">
            <form method="post" action="${meta.assetContentPath}" class="Form-Ajax" data-add-date="true">
                <fieldset class="form-wrapper field">
                    <input type="hidden" name="_charset_" value="UTF-8"/>

                    <div class="cms-grid cms-grid--multiline">
                        <div class="cms-grid__item cms-grid__item--half">
                            <div class="field">
                                <label class="label is-small">${'Title' @ i18n}</label>
                                <div class="control">
                                    <input class="input is-small" type="text" name="jcr:title" value="${meta.title}"/>
                                </div>
                            </div>
                        </div>
                        <div class="cms-grid__item cms-grid__item--half">
                            <div class="field">
                                <label class="label is-small">${'Alt Text' @ i18n}</label>
                                <div class="field has-addons">
                                    <div class="control is-expanded">
                                        <input class="input is-small" type="text" name="alt" value="${meta.altText}" id="alt-text-input"/>
                                    </div>
                                    <sly data-sly-test="${meta.image}">
                                        <div class="control">
                                            <button type="button"
                                                    class="button is-small ai-suggest-button"
                                                    data-ai-type="altText"
                                                    data-ai-target="alt-text-input"
                                                    data-image-path="${meta.assetPath}"
                                                    title="${'Suggest Alt Text using AI' @ i18n}">
                                                <span class="cms-icon cms-icon--ai"></span>
                                                <span class="ai-button-text">${'AI' @ i18n}</span>
                                            </button>
                                        </div>
                                    </sly>
                                </div>
                            </div>
                        </div>
                        <div class="cms-grid__item cms-grid__item--full">
                            <div class="field">
                                <label class="label is-small">${'Description' @ i18n}</label>
                                <div class="control">
                                    <textarea class="textarea is-small" name="jcr:description" rows="2">${meta.description}</textarea>
                                </div>
                            </div>
                        </div>
                        <div class="cms-grid__item cms-grid__item--half">
                            <div class="field">
                                <label class="label is-small">${'Copyright' @ i18n}</label>
                                <div class="control">
                                    <input class="input is-small" type="text" name="dc:rights" value="${meta.copyright}"/>
                                </div>
                            </div>
                        </div>
                        <div class="cms-grid__item cms-grid__item--half">
                            <div class="field">
                                <label class="label is-small">${'Creator' @ i18n}</label>
                                <div class="control">
                                    <input class="input is-small" type="text" name="dc:creator" value="${meta.creator}"/>
                                </div>
                            </div>
                        </div>
                        <div class="cms-grid__item cms-grid__item--half">
                            <div class="field">
                                <label class="label is-small">${'Source' @ i18n}</label>
                                <div class="control">
                                    <input class="input is-small" type="text" name="dc:source" value="${meta.source}"/>
                                </div>
                            </div>
                        </div>
                        <div class="cms-grid__item cms-grid__item--half">
                            <div class="field">
                                <label class="label is-small">${'Keywords' @ i18n}</label>
                                <div class="control">
                                    <input class="input is-small" type="text" name="keywords" value="${meta.keywords}"/>
                                </div>
                            </div>
                        </div>
                        
                        <!--/* Taxonomy / Tags field */-->
                        <div class="cms-grid__item cms-grid__item--full">
                            <div class="field">
                                <label class="label is-small">${'Tags' @ i18n}</label>
                                <div class="labelfield">
                                    <fieldset disabled="disabled" class="labelfield__template is-hidden">
                                        <a class="tag labelfield__item" title="">
                                            <input type="hidden" name="sling:taxonomy" value="" />
                                            <span class="labelfield__title"></span>
                                            <button class="delete is-small">
                                                <span class="is-sr-only">${'Delete' @ i18n}</span>
                                            </button>
                                        </a>
                                    </fieldset>
                                    <div class="labelfield__field field has-addons">
                                        <div class="control is-expanded">
                                            <input class="input is-small" type="text" id="taxonomy-field" list="taxonomy-options" autocomplete="off"/>
                                        </div>
                                        <div class="control">
                                            <button class="labelfield__add button is-small">
                                                <span class="jam jam-plus">
                                                    <span class="is-sr-only">${'Add' @ i18n}</span>
                                                </span>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="labelfield__container tags are-medium mt-2">
                                        <sly data-sly-list.item="${meta.assignedTaxonomyItems}">
                                            <a class="tag labelfield__item is-info" title="${item.path}">
                                                <input type="hidden" name="sling:taxonomy" value="${item.path}"/>
                                                <span class="labelfield__title">${item.title}</span>
                                                <button class="delete is-small">
                                                    <span class="is-sr-only">${'Delete' @ i18n}</span>
                                                </button>
                                            </a>
                                        </sly>
                                    </div>
                                    <datalist id="taxonomy-options">
                                        <sly data-sly-list.option="${meta.taxonomyOptions}">
                                            <option value="${option.path}">${option.title}</option>
                                        </sly>
                                    </datalist>
                                    <input type="hidden" name="sling:taxonomy@TypeHint" value="String[]"/>
                                    <input type="hidden" name="sling:taxonomy@Delete" value="delete"/>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="field is-grouped mt-3">
                        <div class="control">
                            <button class="button is-primary is-small" type="submit">${'Save' @ i18n}</button>
                        </div>
                        <div class="control">
                            <button type="button" class="button is-small close">${'Cancel' @ i18n}</button>
                        </div>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</div>
