<sly data-sly-use.model="org.apache.sling.cms.core.models.AssetFilterBarModel">
    <div class="asset-filter-bar" data-component="asset-filter-bar">
        <div class="asset-filter-bar__search">
            <div class="control has-icons-left">
                <input class="input" type="text" placeholder="${'Search assets...' @ i18n}"
                       data-asset-search aria-label="${'Search assets...' @ i18n}">
                <span class="icon is-left">
                    <i class="jam jam-search"></i>
                </span>
            </div>
        </div>

        <div class="asset-filter-bar__filters">
            <div class="select">
                <select data-asset-type-filter aria-label="Filter by type">
                    <option value="">${'All Types' @ i18n}</option>
                    <option value="image/">${'Images' @ i18n}</option>
                    <option value="video/">${'Videos' @ i18n}</option>
                    <option value="application/pdf,application/msword,application/vnd">${'Documents' @ i18n}</option>
                </select>
            </div>

            <!-- Taxonomy Filter -->
            <div class="select">
                <select data-asset-tag-filter aria-label="Filter by tag">
                    <option value="">${'All Tags' @ i18n}</option>
                    <sly data-sly-list.taxonomy="${model.taxonomyOptions}">
                        <option value="${taxonomy.path}">${taxonomy.title}</option>
                    </sly>
                </select>
            </div>
        </div>

        <div class="asset-filter-bar__view-toggle">
            <div class="buttons has-addons">
                <button class="button is-small asset-view-btn is-selected" data-view="grid" title="${'Grid View' @ i18n}">
                    <span class="icon">
                        <i class="jam jam-grid"></i>
                    </span>
                </button>
                <button class="button is-small asset-view-btn" data-view="list" title="${'List View' @ i18n}">
                    <span class="icon">
                        <i class="jam jam-unordered-list"></i>
                    </span>
                </button>
            </div>
        </div>

        <div class="asset-filter-bar__count">
            <span data-asset-count>0</span> ${'items' @ i18n}
        </div>
    </div>
</sly>
