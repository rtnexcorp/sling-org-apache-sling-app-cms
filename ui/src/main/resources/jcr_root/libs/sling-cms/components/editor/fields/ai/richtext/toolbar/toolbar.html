<sly data-sly-use.parentField="${'org.apache.sling.cms.core.models.AiSuggestField' @ request=request}">
    <div class="rte-toolbar">
        <sly data-sly-list.child="${resource.listChildren}">
            <sly data-sly-resource="${child}"></sly>
        </sly>
        <sly data-sly-test="${parentField.hasAiSuggestions}">
            <div class="level is-mobile">
                <div class="level-item">
                    <button type="button"
                            class="button is-small is-primary cms-ai-suggest-btn cms-ai-suggest-btn--richtext"
                            data-ai-type="${parentField.aiSuggestionType}"
                            data-ai-source="${parentField.contentSource}"
                            data-ai-field="${parentField.name}">
                        <span class="icon is-small">
                            <i class="jam jam-magic"></i>
                        </span>
                        <span>AI Suggest</span>
                    </button>
                </div>
            </div>
        </sly>
    </div>
</sly>
