<sly data-sly-use.model="org.apache.sling.cms.core.models.LastModifiedColumnModel">
    <sly data-sly-test="${model.hasDate}">
        <td title="${model.titleValue @ context='attribute'}" data-property="lastModified">
            ${model.lastModified @ context='html'}<br/>
            ${model.lastModifiedBy @ context='html'}
        </td>
    </sly>
    <sly data-sly-test="${!model.hasDate}">
        <td title=""></td>
    </sly>
</sly>
