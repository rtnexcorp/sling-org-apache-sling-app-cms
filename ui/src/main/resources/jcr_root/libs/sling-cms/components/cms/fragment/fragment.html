<sly data-sly-use.fragment="org.apache.sling.cms.reference.models.ContentFragmentModel">
    <div class="cms-fragment">
        <sly data-sly-test="${fragment.loaded}">
            <div class="cms-fragment__header">
                <h3 class="cms-fragment__title">${fragment.title}</h3>
                <span class="cms-fragment__schema" data-sly-test="${fragment.schemaId}">
                    Schema: ${fragment.schemaId}
                </span>
            </div>
            <div class="cms-fragment__content">
                <sly data-sly-list.entry="${fragment.propertyEntries}">
                    <div class="cms-fragment__field">
                        <span class="cms-fragment__field-label">${entry.key}:</span>
                        <span class="cms-fragment__field-value">${entry.value}</span>
                    </div>
                </sly>
            </div>
        </sly>
        <div class="notification is-warning" data-sly-test="${!fragment.loaded}">
            <p>Content fragment not found or could not be loaded.</p>
        </div>
    </div>
</sly>
