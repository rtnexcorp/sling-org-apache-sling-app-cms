<div class="cms-workflow-dashboard-tabs">
    <div class="tabs is-boxed">
        <ul>
            <li class="is-active" data-tab="definitions">
                <a>
                    <span class="icon"><em class="jam jam-document"></em></span>
                    <span>${'Definitions' @ i18n}</span>
                </a>
            </li>
            <li data-tab="instances">
                <a>
                    <span class="icon"><em class="jam jam-cogs"></em></span>
                    <span>${'Active Instances' @ i18n}</span>
                </a>
            </li>
            <li data-tab="tasks">
                <a>
                    <span class="icon"><em class="jam jam-task-list"></em></span>
                    <span>${'Task Inbox' @ i18n}</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="cms-workflow-dashboard-tabs__content">
        <div class="cms-workflow-dashboard-tabs__panel is-active" data-panel="definitions">
            <sly data-sly-resource="${'definitionstab' @ resourceType='sling-cms/components/cms/workflow/definitionlist'}"/>
        </div>
        <div class="cms-workflow-dashboard-tabs__panel" data-panel="instances">
            <sly data-sly-resource="${'instancestab' @ resourceType='sling-cms/components/cms/workflow/instancemonitor'}"/>
        </div>
        <div class="cms-workflow-dashboard-tabs__panel" data-panel="tasks">
            <sly data-sly-resource="${'taskinboxtab' @ resourceType='sling-cms/components/cms/workflow/taskinbox'}"/>
        </div>
    </div>
</div>
