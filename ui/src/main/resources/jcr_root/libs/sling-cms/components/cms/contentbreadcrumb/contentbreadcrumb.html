<sly data-sly-use.breadcrumb="org.apache.sling.cms.core.models.ContentBreadcrumb">
    <nav class="breadcrumb" aria-label="breadcrumbs">
        <ul>
            <sly data-sly-list.parent="${breadcrumb.parents}">
                <li>
                    <a href="${parent.left @ context='attribute'}">
                        ${parent.right @ context='html'}
                    </a>
                </li>
            </sly>
            <li class="is-active">
                <div role="heading" aria-level="1">
                    <a href="#">
                        ${breadcrumb.currentItem @ context='html'}
                    </a>
                </div>
            </li>
        </ul>
        <span class="content-filter-bar">
            <sly data-sly-test="${!properties.hideSearch}" data-sly-resource="${'contentsearch' @ resourceType='sling-cms/components/cms/contentsearch'}"></sly>
            <sly data-sly-test="${!properties.hideFilter}" data-sly-resource="${'contentfilter' @ resourceType='sling-cms/components/cms/contentfilter'}"></sly>
        </span>
    </nav>
</sly>
