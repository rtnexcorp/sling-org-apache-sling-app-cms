<sly data-sly-use.breadcrumb="org.apache.sling.cms.core.models.ContentBreadcrumb">
    <nav class="breadcrumb" aria-label="breadcrumbs">
        <ul>
            <sly data-sly-list.parent="${breadcrumb.parents}">
                <li>
                    <a href="${parent.left @ context='attribute'}">
                        ${parent.right @ context='html'}
                    </a>
                </li>
            </sly>
            <li class="is-active">
                <div role="heading" aria-level="1">
                    <a href="#">
                        ${breadcrumb.currentItem @ context='html'}
                    </a>
                </div>
            </li>
        </ul>
        <sly data-sly-test="${!properties.hideSearch}">
            <div class="contentnav-search">
                <p class="control has-icons-left">
                    <label class="is-sr-only" for="search-term">${'Search' @ i18n}</label>
                    <input class="input is-small" type="text" name="search" id="search-term" />
                    <span class="icon is-small is-left">
                        <i class="jam jam-search" aria-hidden="true"></i>
                    </span>
                </p>
            </div>
        </sly>
    </nav>
</sly>
