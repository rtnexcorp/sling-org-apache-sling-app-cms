<!--/* File Info Panel - displays file metadata and actions */-->
<template data-sly-template.infoPanel="${@ preview}">
    <h4 class="title is-5">${'Info' @ i18n}</h4>
    <table class="table is-fullwidth is-narrow">
        <tbody>
            <tr><th>${'File' @ i18n}</th><td>${preview.fileName}</td></tr>
            <tr><th>${'Type' @ i18n}</th><td><span class="tag ${preview.fileTypeColor}">${preview.mimeType}</span></td></tr>
        </tbody>
    </table>

    <!--/* Renditions for previewable types */-->
    <sly data-sly-test="${preview.previewable && preview.hasRenditions}">
        <h4 class="title is-6 mt-4">${'Renditions' @ i18n}</h4>
        <div class="buttons are-small">
            <a href="${preview.filePath}" class="button is-info preview-link" data-image="${preview.filePath}">
                <span class="icon"><span class="jam jam-picture"></span></span>
                <span>${'Original' @ i18n}</span>
            </a>
            <sly data-sly-list.rendition="${preview.supportedRenditions}">
                <a href="${preview.filePath}.transform/${rendition}.png" 
                   class="button is-link is-outlined preview-link"
                   data-image="${preview.filePath}.transform/${rendition}.png">
                    <span class="icon"><span class="jam jam-picture"></span></span>
                    <span>${rendition}</span>
                </a>
            </sly>
        </div>
    </sly>

    <!--/* Download & Close */-->
    <div class="field is-grouped mt-4">
        <p class="control">
            <a href="${preview.filePath}" download="${preview.fileName}" class="button is-success">
                <span class="icon"><span class="jam jam-download"></span></span>
                <span>${'Download' @ i18n}</span>
            </a>
        </p>
        <p class="control">
            <button type="button" class="button close">${'Close' @ i18n}</button>
        </p>
    </div>
</template>
