<div  data-component="content-filter">
    <div class="content-filter__controls">
        <!--/* Asset Type Filter */-->
        <div>
            <div class="cms-select">
                <select id="filter-asset-type"
                        data-filter="asset-type"
                        class="cms-select__input"
                        aria-label="${'Filter by Type' @ i18n}">
                    <option value="">${'All Assets' @ i18n}</option>
                    <option value="image/">${'Images' @ i18n}</option>
                    <option value="video/">${'Videos' @ i18n}</option>
                    <option value="audio/">${'Audio' @ i18n}</option>
                    <option value="application/pdf">${'PDF Documents' @ i18n}</option>
                    <option value="application/msword,application/vnd.openxmlformats-officedocument">${'Office Documents' @ i18n}</option>
                </select>
            </div>
        </div>

        <!--/* Asset Size Filter */-->
        <div>
            <div class="cms-select">
                <select id="filter-asset-size"
                        data-filter="asset-size"
                        class="cms-select__input"
                        aria-label="${'Filter by Size' @ i18n}">
                    <option value="">${'All Sizes' @ i18n}</option>
                    <option value="0-100">${'< 100 KB' @ i18n}</option>
                    <option value="100-1024">${'100 KB - 1 MB' @ i18n}</option>
                    <option value="1024-10240">${'1 MB - 10 MB' @ i18n}</option>
                    <option value="10240-">${'> 10 MB' @ i18n}</option>
                </select>
            </div>
        </div>

        <!--/* Modified Date Filter */-->
        <div>
            <div class="cms-select">
                <select id="filter-modified"
                        data-filter="modified-date"
                        class="cms-select__input"
                        aria-label="${'Modified Date' @ i18n}">
                    <option value="">${'Any Time' @ i18n}</option>
                    <option value="today">${'Today' @ i18n}</option>
                    <option value="week">${'This Week' @ i18n}</option>
                    <option value="month">${'This Month' @ i18n}</option>
                    <option value="year">${'This Year' @ i18n}</option>
                </select>
            </div>
        </div>
    </div>
  
</div>
