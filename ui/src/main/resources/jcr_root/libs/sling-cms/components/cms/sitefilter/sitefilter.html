<div  data-component="content-filter">
    <div class="content-filter__controls">
        <!--/* Page Status Filter */-->
        <div>
            <div class="cms-select">
                <select id="filter-page-status"
                        data-filter="page-status"
                        class="cms-select__input"
                        aria-label="${'Page Status' @ i18n}">
                    <option value="">${'All Pages' @ i18n}</option>
                    <option value="published">${'Published' @ i18n}</option>
                    <option value="draft">${'Draft' @ i18n}</option>
                    <option value="scheduled">${'Scheduled' @ i18n}</option>
                </select>
            </div>
        </div>

        <!--/* Template Filter */-->
        <div>
            <div class="cms-select">
                <select id="filter-template"
                        data-filter="template"
                        data-dynamic-options="true"
                        class="cms-select__input"
                        aria-label="${'Filter by Template' @ i18n}">
                    <option value="">${'All Templates' @ i18n}</option>
                </select>
            </div>
        </div>

        <!--/* Modified Date Filter */-->
        <div>
            <div class="cms-select">
                <select id="filter-modified"
                        data-filter="modified-date"
                        class="cms-select__input"
                        aria-label="${'Modified Date' @ i18n}">
                    <option value="">${'Any Time' @ i18n}</option>
                    <option value="today">${'Today' @ i18n}</option>
                    <option value="week">${'This Week' @ i18n}</option>
                    <option value="month">${'This Month' @ i18n}</option>
                    <option value="year">${'This Year' @ i18n}</option>
                </select>
            </div>
        </div>
    </div>
</div>
