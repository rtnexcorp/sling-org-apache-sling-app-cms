<sly data-sly-use.model="org.apache.sling.cms.core.models.AiSuggestField">
    <div class="field cms-ai-suggest-field cms-ai-suggest-field--richtext"
         data-ai-type="${model.aiSuggestionType}"
         data-content-source="${model.contentSource}">
        <sly data-sly-test="${model.label}">
            <label class="label" for="${model.name}">
                ${model.label @ i18n}
            </label>
        </sly>
        <div class="control">
            <div class="rte">
                <sly data-sly-test="${model.toolbar}">
                    <sly data-sly-resource="${model.toolbar @ resourceType='sling-cms/components/editor/fields/richtext/toolbar'}"></sly>
                </sly>
                <sly data-sly-test="${!model.toolbar}">
                    <sly data-sly-resource="${'/libs/sling-cms/components/editor/fields/richtext/toolbar/default' @ resourceType='sling-cms/components/editor/fields/richtext/toolbar'}"></sly>
                </sly>
                <textarea class="rte-editor textarea cms-ai-suggest-input"
                          id="${model.name}"
                          name="${model.fieldName}"
                          aria-required="${model.required}"
                          required="${model.requiredAttr}"
                          disabled="${model.disabledAttr}">${model.value}</textarea>
            </div>
            <sly data-sly-test="${model.hasAiSuggestions}">
                <button type="button"
                        class="button is-small is-text cms-ai-suggest-btn cms-ai-suggest-btn--richtext"
                        title="Generate AI suggestion">
                    <span class="cms-icon cms-icon--ai"></span>
                    <span>AI Suggest</span>
                </button>
            </sly>
        </div>
        <sly data-sly-test="${model.help}">
            <p class="help">
                ${model.help @ i18n}
            </p>
        </sly>
    </div>
</sly>
