<div  data-component="content-filter">
    <div class="cms-workflow-filter__controls">
        <!--/* Process Type Filter */-->
        <div>
            <div class="cms-select">
                <select id="filter-process-type"
                        data-filter="process-type"
                        data-dynamic-options="true"
                        class="cms-select__input"
                        aria-label="${'Filter by Process' @ i18n}">
                    <option value="">${'All Processes' @ i18n}</option>
                </select>
            </div>
        </div>

        <!--/* Status Filter */-->
        <div>
            <div class="cms-select">
                <select id="filter-status"
                        data-filter="status"
                        class="cms-select__input"
                        aria-label="${'Filter by Status' @ i18n}">
                    <option value="">${'All Status' @ i18n}</option>
                    <option value="active">${'Active' @ i18n}</option>
                    <option value="suspended">${'Suspended' @ i18n}</option>
                </select>
            </div>
        </div>

        <!--/* Assignee Filter */-->
        <div>
            <div class="cms-select">
                <select id="filter-assignee"
                        data-filter="assignee"
                        class="cms-select__input"
                        aria-label="${'Filter by Assignee' @ i18n}">
                    <option value="">${'All Users' @ i18n}</option>
                    <option value="me">${'My Tasks' @ i18n}</option>
                    <option value="unassigned">${'Unassigned' @ i18n}</option>
                </select>
            </div>
        </div>
    </div>
</div>
