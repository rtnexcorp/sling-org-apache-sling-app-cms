<sly data-sly-use.tabs="org.apache.sling.cms.core.models.TabsModel">
    <div class="cms-tabs" data-tabs-id="${tabs.tabsId}">
        <div class="tabs is-boxed">
            <ul>
                <sly data-sly-list.tab="${tabs.tabs}">
                    <li class="${tabList.first ? 'is-active' : ''}" data-tab="${tab.id}">
                        <a>
                            <sly data-sly-test="${tab.icon}">
                                <span class="icon"><em class="jam jam-${tab.icon}"></em></span>
                            </sly>
                            <span>${tab.title}</span>
                        </a>
                    </li>
                </sly>
            </ul>
        </div>

        <div class="cms-tabs__content">
            <sly data-sly-list.tab="${tabs.tabs}">
                <div class="cms-tabs__panel ${tabList.first ? 'is-active' : ''}" data-panel="${tab.id}">
                    <sly data-sly-test="${tab.resourceType}">
                        <sly data-sly-resource="${tab.resourceName @ resourceType=tab.resourceType}"/>
                    </sly>
                    <sly data-sly-test="${!tab.resourceType}">
                        <sly data-sly-resource="${tab.resourceName}"/>
                    </sly>
                </div>
            </sly>
        </div>
    </div>
</sly>
