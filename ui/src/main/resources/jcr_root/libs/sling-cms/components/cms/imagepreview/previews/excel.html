<!--/* Excel Preview - renders XLSX files using SheetJS */-->
<template data-sly-template.excelPreview="${@ preview}">
    <div class="box has-background-light" data-docpreview="excel" data-filepath="${preview.filePath}">
        <div class="docpreview-loading has-text-centered py-6">
            <span class="icon is-large"><span class="jam jam-refresh jam-spin"></span></span>
            <p>${'Loading spreadsheet...' @ i18n}</p>
        </div>
        <div class="docpreview-tabs tabs is-small" style="display:none;">
            <ul class="docpreview-tabs-list"></ul>
        </div>
        <div class="docpreview-content cms-spreadsheet-preview" style="max-height:450px; overflow:auto; display:none;"></div>
        <div class="docpreview-error has-text-centered py-6" style="display:none;">
            <span class="icon is-large has-text-warning"><span class="jam jam-alert" style="font-size:2rem;"></span></span>
            <p class="mt-2">${'Could not preview spreadsheet' @ i18n}</p>
        </div>
    </div>
    <p class="help has-text-centered">${'Excel preview - click tabs to switch sheets' @ i18n}</p>
</template>
