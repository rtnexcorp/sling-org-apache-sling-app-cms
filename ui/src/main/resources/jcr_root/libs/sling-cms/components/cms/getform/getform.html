<sly data-sly-use.model="org.apache.sling.cms.core.models.GetFormModel">
    <form method="get" action="${model.action @ context='attribute'}" class="get-form" 
          data-target="${model.target @ context='attribute'}" 
          data-load="${model.load @ context='attribute'}">
        <fieldset class="form-wrapper field">
            <input type="hidden" name="_charset_" value="utf-8"/>
            <sly data-sly-resource="${'fields' @ resourceType='sling-cms/components/general/container'}"></sly>
            <div class="Field-Group">
                <button type="submit" class="button is-primary" title="${model.buttonText @ context='html'}">
                    ${model.buttonText @ context='html'}
                </button>
            </div>
        </fieldset>
    </form>
</sly>
