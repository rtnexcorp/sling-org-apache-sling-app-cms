<sly data-sly-use.searchResults="org.apache.sling.cms.core.models.SearchResults"></sly>
<div>
    <sly data-sly-test="${searchResults.resultList.size > 0}">
        <sly data-sly-list.item="${searchResults.resultList}">
            <a class="panel-block" 
               title="${item.path}" 
               href="/cms/site/content.html${item.parent.path}?resource=${item.path}">
                <span class="panel-icon">
                    <sly data-sly-test="${item.resourceType == 'sling:Page'}">
                        <i class="jam jam-document" aria-hidden="true"></i>
                    </sly>
                    <sly data-sly-test="${item.resourceType != 'sling:Page'}">
                        <i class="jam jam-file" aria-hidden="true"></i>
                    </sly>
                </span>
                <sly data-sly-test="${item.resourceType == 'sling:Page'}">
                    ${item.valueMap['jcr:content/jcr:title'] || item.name}
                </sly>
                <sly data-sly-test="${item.resourceType != 'sling:Page'}">
                    ${item.name}
                </sly>
            </a>
        </sly>
    </sly>
    <sly data-sly-test="${searchResults.resultList.empty}">
        <span class="panel-block">
            ${'No Results' @ i18n}
        </span>
    </sly>
</div>
