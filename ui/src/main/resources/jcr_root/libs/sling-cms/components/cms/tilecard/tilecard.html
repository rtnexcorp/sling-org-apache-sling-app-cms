<sly data-sly-use.branding="org.apache.sling.cms.core.models.BrandingModel">
    <div class="cms-grid__item cms-grid__item--half-tablet cms-grid__item--third-widescreen cms-grid__item--quarter-fullhd contentnav__item">
        <div class="card is-linked cms-tile-card" title="${properties.title @ i18n}" data-value="${resource.path}">
            <div class="card-image">
                <figure class="image is-5by4">
                    <img src="/cms/file/preview.html${branding.gridIconsBase}${properties.icon}"
                         loading="lazy"
                         alt="${properties.title @ i18n}">
                </figure>
            </div>
            <footer class="card-footer">
                <a class="card-footer-item item-link" href="${properties.link}" title="${properties.title @ i18n}">
                    ${properties.title @ i18n}
                </a>
            </footer>
        </div>
    </div>
</sly>
