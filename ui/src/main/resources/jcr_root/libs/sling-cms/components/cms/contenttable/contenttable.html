<sly data-sly-use.model="org.apache.sling.cms.core.models.ContentTableModel">
<div class="reload-container table__wrapper scroll-container contentnav" 
     data-filterable-container
     data-path="${resource.path @ context='attribute'}.table.html${model.requestSuffix @ context='attribute'}">
    <table class="table is-fullwidth is-striped sortable cms-table cms-table--sortable">
        <thead>
            <tr>
                <th scope="col">#</th>
                <sly data-sly-list.column="${model.columns}">
                    <th class="${column.actionsColumn ? 'is-hidden cms-table__header--hidden' : ''}"
                        data-attribute="${column.name @ context='attribute'}"
                        scope="col">
                        ${column.title @ i18n}
                    </th>
                </sly>
            </tr>
        </thead>
        <tbody>
            <sly data-sly-list.row="${model.rows}">
                <tr class="contentnav__item"
                    data-filterable-item
                    data-resource="${row.path @ context='attribute'}"
                    data-type="${row.typePath @ context='attribute'}"
                    data-mime-type="${row.mimeType @ context='attribute'}"
                    data-asset-type="${row.mimeType @ context='attribute'}"
                    data-is-folder="${row.folder}"
                    data-taxonomy="${row.taxonomyString @ context='attribute'}"
                    data-page-status="${row.pageStatus @ context='attribute'}"
                    data-template="${row.template @ context='attribute'}"
                    data-modified-date="${row.modifiedDate @ context='attribute'}">
                    <td class="Cell-Static cms-table__cell--static"
                        title="# ${row.rowNumber}"
                        data-sort-value="${row.rowNumberFormatted}">
                        ${row.rowNumber}
                    </td>
                    <sly data-sly-list.colConfig="${row.columnConfigs}">
                        <sly data-sly-test="${colConfig.hasResourceType}">
                            <sly data-sly-resource="${row.path @ resourceType=colConfig.resourceType, requestAttributes=colConfig.properties}"></sly>
                        </sly>
                    </sly>
                </tr>
            </sly>
        </tbody>
    </table>
    <sly data-sly-test="${model.rows.size == 0}">
        <div class="notification is-info has-text-centered">
            <p class="mb-3">No items found.</p>
            <p class="has-text-grey-light">Use the button below to add your first item.</p>
        </div>
    </sly>
    <nav class="pagination" role="navigation" aria-label="pagination">
        <a data-sly-test="${model.hasPreviousPage}"
           class="pagination-previous"
           href="?page=${model.previousPage}">${'Previous' @ i18n}</a>
        <a data-sly-test="${model.hasNextPage}"
           class="pagination-next"
           href="?page=${model.nextPage}">${'Next' @ i18n}</a>
    </nav>
</div>
</sly>
