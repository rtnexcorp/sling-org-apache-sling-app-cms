<sly data-sly-use.fragmentEditor="${'org.apache.sling.cms.core.models.FragmentEditor' @ request=request}">
    <div class="cms-fragment-editor">
        <sly data-sly-list.field="${fragmentEditor.fields}">
            <div class="field">
                <sly data-sly-test="${field.type == 'STRING'}">
                    <label class="label" for="${field.name}">${field.label || field.name}</label>
                    <div class="control">
                        <input class="input" type="text" name="${field.name}" id="${field.name}" 
                               value="${fragmentEditor.properties[field.name] @ context='attribute'}" 
                               required="${field.required}" 
                               placeholder="${field.description}"/>
                    </div>
                    <p class="help" data-sly-test="${field.description}">${field.description}</p>
                </sly>
                
                <sly data-sly-test="${field.type == 'TEXT'}">
                    <label class="label" for="${field.name}">${field.label || field.name}</label>
                    <div class="control">
                        <textarea class="textarea" name="${field.name}" id="${field.name}" 
                                  required="${field.required}" 
                                  placeholder="${field.description}" 
                                  rows="5">${fragmentEditor.properties[field.name]}</textarea>
                    </div>
                    <p class="help" data-sly-test="${field.description}">${field.description}</p>
                </sly>
                
                <sly data-sly-test="${field.type == 'BOOLEAN'}">
                    <div class="field">
                        <label class="checkbox">
                            <input type="checkbox" name="${field.name}" value="true" 
                                   checked="${fragmentEditor.properties[field.name] == 'true' || fragmentEditor.properties[field.name] == true}" />
                            ${field.label || field.name}
                        </label>
                        <p class="help" data-sly-test="${field.description}">${field.description}</p>
                    </div>
                </sly>
                
                <sly data-sly-test="${field.type == 'INTEGER' || field.type == 'DECIMAL'}">
                    <label class="label" for="${field.name}">${field.label || field.name}</label>
                    <div class="control">
                        <input class="input" type="number" name="${field.name}" id="${field.name}" 
                               value="${fragmentEditor.properties[field.name]}" 
                               required="${field.required}" 
                               step="${field.type == 'DECIMAL' ? '0.01' : '1'}"
                               placeholder="${field.description}"/>
                    </div>
                    <p class="help" data-sly-test="${field.description}">${field.description}</p>
                </sly>
                
                <sly data-sly-test="${field.type == 'DATE'}">
                    <label class="label" for="${field.name}">${field.label || field.name}</label>
                    <div class="control">
                        <input class="input" type="date" name="${field.name}" id="${field.name}" 
                               value="${fragmentEditor.properties[field.name]}" 
                               required="${field.required}"/>
                    </div>
                    <p class="help" data-sly-test="${field.description}">${field.description}</p>
                </sly>
                
                <sly data-sly-test="${field.type == 'DATETIME'}">
                    <label class="label" for="${field.name}">${field.label || field.name}</label>
                    <div class="control">
                        <input class="input" type="datetime-local" name="${field.name}" id="${field.name}" 
                               value="${fragmentEditor.properties[field.name]}" 
                               required="${field.required}"/>
                    </div>
                    <p class="help" data-sly-test="${field.description}">${field.description}</p>
                </sly>
                
                <sly data-sly-test="${field.type == 'SELECT'}">
                    <label class="label" for="${field.name}">${field.label || field.name}</label>
                    <div class="control">
                        <div class="select">
                            <select name="${field.name}" id="${field.name}" required="${field.required}">
                                <option value="">-- Select --</option>
                                <sly data-sly-list.option="${field.options}">
                                    <option value="${option}" selected="${fragmentEditor.properties[field.name] == option}">
                                        ${option}
                                    </option>
                                </sly>
                            </select>
                        </div>
                    </div>
                    <p class="help" data-sly-test="${field.description}">${field.description}</p>
                </sly>
                
                <sly data-sly-test="${field.type == 'REFERENCE'}">
                    <label class="label" for="${field.name}">${field.label || field.name}</label>
                    <div class="control">
                        <input class="input pathfield" type="text" name="${field.name}" id="${field.name}" 
                               value="${fragmentEditor.properties[field.name] @ context='attribute'}" 
                               required="${field.required}" 
                               placeholder="${field.description}"/>
                    </div>
                    <p class="help" data-sly-test="${field.description}">${field.description}</p>
                </sly>
                
                <sly data-sly-test="${field.type == 'ASSET'}">
                    <label class="label" for="${field.name}">${field.label || field.name}</label>
                    <div class="control">
                        <input class="input pathfield" type="text" name="${field.name}" id="${field.name}" 
                               value="${fragmentEditor.properties[field.name] @ context='attribute'}" 
                               required="${field.required}" 
                               data-base-path="/content/apache/sling-cms/assets"
                               placeholder="${field.description}"/>
                    </div>
                    <p class="help" data-sly-test="${field.description}">${field.description}</p>
                </sly>
                
                <sly data-sly-test="${field.type == 'TAG'}">
                    <label class="label" for="${field.name}">${field.label || field.name}</label>
                    <div class="control">
                        <input class="input tagfield" type="text" name="${field.name}" id="${field.name}" 
                               value="${fragmentEditor.properties[field.name] @ context='attribute'}" 
                               required="${field.required}" 
                               placeholder="${field.description}"/>
                    </div>
                    <p class="help" data-sly-test="${field.description}">${field.description}</p>
                </sly>
            </div>
        </sly>
        
        <div class="notification is-warning" data-sly-test="${!fragmentEditor.schema}">
            <p>No schema found for this fragment. Please set the 'schemaId' property.</p>
        </div>
    </div>
</sly>
