<sly data-sly-use.model="org.apache.sling.cms.core.models.AssetCardModel">
    <div class="asset-card card is-linked" 
         title="${model.assetTitle}" 
         data-value="${model.assetPath}" 
         data-mime-type="${model.mimeType}">
        
        <div class="card-image">
            <figure class="image is-5by4">
                <img src="${model.thumbnailPath}" 
                     loading="lazy" 
                     alt="${model.assetTitle}" 
                     class="asset-thumbnail">
                
                <!--/* Video Badge */-->
                <sly data-sly-test="${model.video}">
                    <span class="asset-badge asset-badge--video">
                        <i class="jam jam-video-camera"></i>
                    </span>
                </sly>
                
                <!--/* PDF Badge */-->
                <sly data-sly-test="${model.pdf}">
                    <span class="asset-badge asset-badge--pdf">PDF</span>
                </sly>
            </figure>
            
            <!--/* Action Overlay */-->
            <div class="asset-card__overlay is-vhidden">
                <div class="asset-card__actions">
                    <sly data-sly-list.actionConfig="${model.actionConfigs}">
                        <sly data-sly-resource="${model.assetPath @ resourceType=actionConfig.valueMap.resourceType}"></sly>
                    </sly>
                </div>
            </div>
        </div>
        
        <div class="card-content asset-card__info">
            <p class="asset-card__title" title="${model.assetTitle}">
                ${model.assetTitle}
            </p>
            
            <div class="asset-card__meta">
                <sly data-sly-test="${model.fileExtension}">
                    <span class="tag is-light is-small">${model.fileExtension}</span>
                </sly>
                
                <sly data-sly-test="${model.formattedFileSize}">
                    <span class="asset-card__size">${model.formattedFileSize}</span>
                </sly>
            </div>
            
            <sly data-sly-test="${model.formattedLastModified}">
                <small class="asset-card__date">${model.formattedLastModified}</small>
            </sly>
        </div>
    </div>
</sly>
