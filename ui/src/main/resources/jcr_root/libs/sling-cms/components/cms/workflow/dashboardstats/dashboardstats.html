<sly data-sly-use.stats="org.apache.sling.cms.workflow.models.WorkflowDashboardStatsModel"/>

<div class="cms-workflow-dashboard-stats">
    <div class="columns is-multiline">
        <div class="column is-3">
            <div class="cms-stat-card cms-stat-card--definitions">
                <div class="cms-stat-card__icon">
                    <span class="jam jam-document"></span>
                </div>
                <div class="cms-stat-card__content">
                    <div class="cms-stat-card__value">${stats.definitionCount}</div>
                    <div class="cms-stat-card__label">${'Workflow Definitions' @ i18n}</div>
                </div>
            </div>
        </div>
        <div class="column is-3">
            <div class="cms-stat-card cms-stat-card--instances">
                <div class="cms-stat-card__icon">
                    <span class="jam jam-cogs"></span>
                </div>
                <div class="cms-stat-card__content">
                    <div class="cms-stat-card__value">${stats.activeInstanceCount}</div>
                    <div class="cms-stat-card__label">${'Active Instances' @ i18n}</div>
                </div>
            </div>
        </div>
        <div class="column is-3">
            <div class="cms-stat-card cms-stat-card--tasks">
                <div class="cms-stat-card__icon">
                    <span class="jam jam-task-list"></span>
                </div>
                <div class="cms-stat-card__content">
                    <div class="cms-stat-card__value">${stats.pendingTaskCount}</div>
                    <div class="cms-stat-card__label">${'Pending Tasks' @ i18n}</div>
                </div>
            </div>
        </div>
        <div class="column is-3">
            <div class="cms-stat-card cms-stat-card--mytasks">
                <div class="cms-stat-card__icon">
                    <span class="jam jam-user"></span>
                </div>
                <div class="cms-stat-card__content">
                    <div class="cms-stat-card__value">${stats.myTaskCount}</div>
                    <div class="cms-stat-card__label">${'My Tasks' @ i18n}</div>
                </div>
            </div>
        </div>
    </div>
</div>
