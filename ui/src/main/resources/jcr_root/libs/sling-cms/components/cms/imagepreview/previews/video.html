<!--/* Video Preview - displays video files with playback controls */-->
<template data-sly-template.videoPreview="${@ preview}">
    <div class="box has-background-dark has-text-centered">
        <video id="previewVideo" controls preload="metadata" style="max-width:100%; max-height:500px;">
            <source src="${preview.filePath}" type="${preview.mimeType}"/>
            ${'Your browser does not support video playback.' @ i18n}
        </video>
    </div>
    <p class="help has-text-centered">${'Use controls to play, pause, and seek' @ i18n}</p>
</template>
