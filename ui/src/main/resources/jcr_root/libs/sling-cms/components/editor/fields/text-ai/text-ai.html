<sly data-sly-use.model="org.apache.sling.cms.core.models.AiSuggestField">
    <div class="field cms-ai-suggest-field" 
         data-ai-type="${model.aiSuggestionType}"
         data-content-source="${model.contentSource}">
        <sly data-sly-test="${model.label}">
            <label class="label" for="${model.name}">
                ${model.label @ i18n}
            </label>
        </sly>
        <div class="control has-icons-right">
            <input type="${model.type}" 
                   class="input cms-ai-suggest-input" 
                   id="${model.name}" 
                   name="${model.fieldName}" 
                   value="${model.value}" 
                   placeholder="${model.placeholder}"
                   aria-required="${model.required}"
                   required="${model.requiredAttr}"
                   disabled="${model.disabledAttr}" />
            <sly data-sly-test="${model.hasAiSuggestions}">
                <button type="button" 
                        class="button is-small is-text cms-ai-suggest-btn" 
                        title="Generate AI suggestion">
                    <span class="cms-icon cms-icon--ai"></span>
                    <span>AI Suggest</span>
                </button>
            </sly>
        </div>
        <sly data-sly-test="${model.help}">
            <p class="help">
                ${model.help @ i18n}
            </p>
        </sly>
    </div>
</sly>
