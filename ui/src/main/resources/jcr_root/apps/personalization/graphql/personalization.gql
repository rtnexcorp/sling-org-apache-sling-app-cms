# Personalization GraphQL Schema (MVP)
#
# This schema is intentionally minimal and matches the existing HTL resolvers
# already present in this codebase.
#
# - Query.segments is resolved by /apps/sling-cms/graphql/Query.segments.html
# - Query.evaluators is resolved by /apps/sling-cms/graphql/Query.evaluators.html
#
# The GraphQL servlet is exposed at /graphql.json via sling:resourceType="personalization/servlet".

schema {
  query: Query
}

type Query {
  "Get all personalization segments"
  segments(
    "Filter by active status (true/false)"
    active: Boolean

    "Filter by evaluator type"
    evaluatorType: String

    "Limit number of results"
    limit: Int
  ): [Segment]

  "Get all available segment evaluators"
  evaluators: [Evaluator]
}

type Segment {
  id: ID!
  name: String!
  description: String
  active: Boolean!
  priority: Int!
  evaluatorType: String!
  path: String!
}

type Evaluator {
  type: String!
  description: String
}
