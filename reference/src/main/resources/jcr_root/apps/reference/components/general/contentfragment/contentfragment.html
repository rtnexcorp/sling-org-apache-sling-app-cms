<sly data-sly-use.fragment="org.apache.sling.cms.reference.models.ContentFragmentModel">
    <sly data-sly-test="${fragment.isLoaded}">
        <div class="content-fragment" data-fragment-path="${fragment.fragmentPath @ context='attribute'}">
            <!-- Display title if available -->
            <sly data-sly-test="${fragment.title}">
                <h2 class="content-fragment__title">${fragment.title}</h2>
            </sly>
            
            <!-- Display all properties in a simple format -->
            <div class="content-fragment__content">
                <sly data-sly-list.entry="${fragment.propertyEntries}">
                    <div class="content-fragment__field">
                        <strong>${entry.key}:</strong>
                        ${entry.value}
                    </div>
                </sly>
            </div>
            
            <!-- Display schema information -->
            <sly data-sly-test="${fragment.schemaId}">
                <p class="content-fragment__schema">
                    <small>Content Type: ${fragment.schemaId}</small>
                </p>
            </sly>
        </div>
    </sly>
    
    <!-- Error message if fragment not loaded -->
    <sly data-sly-test="${!fragment.isLoaded}">
        <div class="notification is-danger">
            <p>Content fragment could not be loaded.</p>
            <p data-sly-test="${properties.fragmentPath}">
                Path: ${properties.fragmentPath @ context='text'}
            </p>
        </div>
    </sly>
</sly>
