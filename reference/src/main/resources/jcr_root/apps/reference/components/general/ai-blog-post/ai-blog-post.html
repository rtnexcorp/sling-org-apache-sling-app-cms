<article class="blog-post box" data-sly-use.blog="org.apache.sling.cms.reference.models.AiBlogPostModel">
    <header class="blog-post-header">
        <h2 class="title is-3">${blog.title}</h2>
        <div class="blog-post-meta">
            <span class="author">
                <strong>By:</strong> ${blog.author}
            </span>
            <span class="publish-date">
                <strong>Published:</strong> ${blog.publishDate}
            </span>
            <sly data-sly-test="${blog.hasTags}">
                <div class="tags">
                    <sly data-sly-list.tag="${blog.tagList}">
                        <span class="tag is-info">${tag}</span>
                    </sly>
                </div>
            </sly>
        </div>
    </header>
    
    <sly data-sly-test="${blog.hasSummary}">
        <div class="blog-post-summary box has-background-light">
            <p class="is-italic">${blog.summary}</p>
        </div>
    </sly>
    
    <div class="blog-post-content content">
        ${blog.content @ context='html'}
    </div>
    
    <sly data-sly-test="${blog.hasMetaDescription}">
        <meta name="description" content="${blog.metaDescription}" />
    </sly>
</article>

<style>
.blog-post {
    margin-bottom: 2rem;
    padding: 2rem;
}

.blog-post-header {
    margin-bottom: 1.5rem;
}

.blog-post-meta {
    display: flex;
    gap: 2rem;
    margin-top: 0.5rem;
    color: #666;
    font-size: 0.9rem;
}

.blog-post-summary {
    padding: 1.5rem;
    margin-bottom: 2rem;
    border-left: 4px solid #9E2165;
}

.blog-post-content {
    line-height: 1.7;
}

.tags {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
}
</style>
