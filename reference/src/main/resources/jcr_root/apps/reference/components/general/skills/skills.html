<sly data-sly-use.skills="org.apache.sling.cms.reference.models.SkillsModel">
    <sly data-sly-test="${skills.hasAuthor}">
        <article class="author-card">
            <sly data-sly-test="${skills.hasImage}">
                <div class="author-image">
                    <img src="${skills.authorImage}" alt="${skills.authorName}"/>
                </div>
            </sly>
            <div class="author-info">
                <h3 class="author-name">${skills.authorName}</h3>
                <sly data-sly-test="${skills.hasJobTitle}">
                    <p class="author-title">${skills.jobTitle}</p>
                </sly>
                <sly data-sly-test="${skills.hasBio}">
                    <p class="author-bio">${skills.bio}</p>
                </sly>
                <sly data-sly-test="${skills.hasEmail}">
                    <p class="author-email">
                        <a href="mailto:${skills.email}">${skills.email}</a>
                    </p>
                </sly>
                <sly data-sly-test="${skills.hasSocialLinks}">
                    <div class="author-social-links" data-sly-list.link="${skills.socialLinks}">
                        <a href="${link.url}"
                           class="social-link social-link--${link.platform}"
                           target="_blank"
                           rel="noopener noreferrer"
                           title="${link.label ? link.label : link.platform}">
                            <span class="social-icon" data-sly-test="${link.platform == 'twitter'}">𝕏</span>
                            <span class="social-icon" data-sly-test="${link.platform == 'linkedin'}">in</span>
                            <span class="social-icon" data-sly-test="${link.platform == 'github'}">⌨</span>
                            <span class="social-icon" data-sly-test="${link.platform == 'facebook'}">f</span>
                            <span class="social-icon" data-sly-test="${link.platform == 'instagram'}">📷</span>
                            <span class="social-icon" data-sly-test="${link.platform == 'youtube'}">▶</span>
                            <span class="social-icon" data-sly-test="${link.platform != 'twitter' && link.platform != 'linkedin' && link.platform != 'github' && link.platform != 'facebook' && link.platform != 'instagram' && link.platform != 'youtube'}">🔗</span>
                            <span class="social-label" data-sly-test="${link.label}">${link.label}</span>
                        </a>
                    </div>
                </sly>
                <sly data-sly-test="${skills.hasSkills}">
                    <div class="author-skills">
                        <h4>Skills</h4>
                        <ul data-sly-list.skill="${skills.skills}">
                            <li class="author-skill">
                                <span class="skill-name">${skill.name}</span>
                                <span class="skill-level">${skill.level}</span>
                                <sly data-sly-test="${skill.description}">
                                    <span class="skill-description">${skill.description}</span>
                                </sly>
                            </li>
                        </ul>
                    </div>
                </sly>
            </div>
        </article>
    </sly>
</sly>
