name: Release

on:
  push:
    tags:
      - 'org.apache.sling.cms-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.1.8)'
        required: true
        type: string

env:
  MAVEN_OPTS: -Xmx2g -XX:+UseParallelGC

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: apache.snapshots.https
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build Release Artifacts
        run: |
          mvn -B clean install -DskipTests -Dbnd.baseline.skip=true
          mvn -B verify -Dbnd.baseline.skip=true

      - name: Create Release Notes
        id: release_notes
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#org.apache.sling.cms-}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          cat > RELEASE_NOTES.md << 'EOF'
          # Apache Sling CMS ${{ env.VERSION }}
          
          ## Changes
          
          See the [full changelog](https://github.com/${{ github.repository }}/compare/org.apache.sling.cms-${{ env.PREV_VERSION }}...org.apache.sling.cms-${{ env.VERSION }}) for details.
          
          ## Artifacts
          
          - Distribution JAR: `org.apache.sling.cms.distribution-${{ env.VERSION }}.jar`
          - Feature Model: `org.apache.sling.cms.feature-${{ env.VERSION }}.slingosgifeature`
          
          ## Docker
          
          ```bash
          docker pull apache/sling-cms:${{ env.VERSION }}
          ```
          
          ## Getting Started
          
          See the [quickstart guide](docs/quickstart.md) for instructions.
          EOF

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.release_notes.outputs.version }}
          path: |
            distribution/target/*.jar
            feature/target/*.slingosgifeature
          retention-days: 30

  docker-release:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Maven artifacts
        run: mvn -B clean install -DskipTests -Dbnd.baseline.skip=true -pl '!it'

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#org.apache.sling.cms-}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/cms
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sling-cms:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sling-cms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
