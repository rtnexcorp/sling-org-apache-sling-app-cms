version: 2
updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      sling:
        patterns:
          - "org.apache.sling*"
      testing:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.apache.sling.testing*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
      apache-commons:
        patterns:
          - "org.apache.commons*"
          - "commons-*"
    ignore:
      # Ignore major version bumps for critical dependencies
      - dependency-name: "org.apache.jackrabbit:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.jackrabbit:oak-*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # npm dependencies for Cypress tests
  - package-ecosystem: "npm"
    directory: "/it"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      cypress:
        patterns:
          - "cypress*"

  # npm dependencies for i18n-helper
  - package-ecosystem: "npm"
    directory: "/i18n-helper"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # Docker
  - package-ecosystem: "docker"
    directory: "/docker/cms"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
